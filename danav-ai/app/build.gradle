plugins { id 'com.android.application' }

android {
    namespace 'com.dilhan.danavai'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dilhan.danavai'
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName '2.3.0'
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    signingConfigs {
        release {
            storeFile file('danav-release.jks')
            storePassword 'vidra-dilhan'
            keyAlias 'vidra'
            keyPassword 'vidra-dilhan'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    // the live voice call (WebSocket to the Gemini live model)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.9.0'
    // attachments: reading the orientation of a picked photo
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
