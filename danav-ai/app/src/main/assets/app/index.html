<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Danav AI</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ai.css">
</head>
<body class="app ai-on">

<!-- The chat, the voice call and the phone panel are drawn by ai.js into #ai.
     This is the tools sidebar that the 3-line button on the right opens: tools, widgets and app settings. -->
<div class="dr-scrim" id="drScrim"></div>
<aside class="dr" id="dr" aria-hidden="true">
  <div class="dr-h">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="8" fill="#dc2626"/><path d="M15 13.5h7.5a10.5 10.5 0 0 1 0 21H15z" stroke="#fff" stroke-width="4.4" fill="none" stroke-linejoin="round"/><path d="M20.5 19.6v8.8l7-4.4z" fill="#fff"/></svg>
    <div class="brand-t">
      <h1>Danav AI</h1>
      <div class="sub" id="drSub">Voice &amp; phone assistant</div>
    </div>
    <button class="icon-btn" id="drClose" aria-label="Close menu"><span data-i="close"></span></button>
  </div>
  <div class="dr-b">
    <div class="dr-t">Tools</div>
    <div class="dr-g" id="drTools"></div>
    <div class="dr-t">Widgets</div>
    <div class="dr-w" id="drWidgets">
      <div class="wg"><small>Time</small><b id="wgClock">—</b></div>
      <div class="wg"><small>Battery</small><b id="wgBatt">—</b></div>
      <div class="wg"><small>Danav remembers</small><b id="wgNotes">—</b></div>
      <div class="wg"><small>Voice</small><b id="wgVoice">—</b></div>
    </div>
    <div class="dr-t">Phone</div>
    <div class="dr-g" id="drMore"></div>
    <div class="dr-f">Danav AI <span id="drVer"></span> · by <b>Dilhan</b></div>
  </div>
</aside>

<script src="icons.js"></script>
<script src="core.js"></script>
<script src="ai.js"></script>
</body>
</html>
